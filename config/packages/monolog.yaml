monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - parser

when@dev:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 10
                channels: [ "!deprecation", "!parser" ]
            console:
                type: console
                process_psr_3_messages: false
                channels: [ "!deprecation", "!parser" ]
            deprecation:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%-deprecation.log"
                level: debug
                max_files: 10
                channels: [ "deprecation" ]
            parser:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%-parser.log"
                level: error
                max_files: 10
                channels: [ "parser" ]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [ 404, 405 ]
                channels: [ "!event" ]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [ 404, 405 ]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
                channels: [ "!deprecation", "!parser" ]
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: [ "!event", "!doctrine", "!deprecation", "!parser" ]
            deprecation:
                type: stream
                channels: [ "deprecation" ]
                path: php://stderr
            parser:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%-parser.log"
                level: error
                max_files: 10
                channels: [ "parser" ]
